services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - flashscale
    restart: unless-stopped

  api:
    build:
      context: ./app/api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PRODUCT_COUNT: ${PRODUCT_COUNT:-100}
      ORDER_PROCESSING_MS: ${ORDER_PROCESSING_MS:-25}
      AIOPS_SCENARIO_TTL_SECONDS: ${AIOPS_SCENARIO_TTL_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - redis
    expose:
      - "3000"
    networks:
      - flashscale
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  worker:
    build:
      context: ./app/worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ORDER_PROCESSING_MS: ${ORDER_PROCESSING_MS:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - flashscale
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - flashscale
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  redis-data:

networks:
  flashscale:
    driver: bridge
